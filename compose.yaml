services:
  pdf-editor:
    container_name: pdf-editor
    image: ${PDF_EDITOR_IMAGE:-ewave/pdf-form-editor:0.1.0}
    platform: linux/amd64
    user: "${PDF_EDITOR_UID:-1000}:${PDF_EDITOR_GID:-1000}"
    ports:
      - "127.0.0.1:${PDF_EDITOR_PORT:-8080}:8080"
    volumes:
      - "${PDF_EDITOR_DOCUMENTS:-./documents}:/documents"
      - type: bind
        source: /
        target: /home/pdfeditor/host_fs
        bind:
          propagation: rslave
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m,mode=1777
      - /home/pdfeditor:rw,nosuid,nodev,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      # Do not recursively relabel the host root. Allow access under host UID permissions.
      - label=disable
      - seccomp=./packaging/docker/seccomp.json
    shm_size: 128m
    stop_grace_period: 10s
    pids_limit: 256
