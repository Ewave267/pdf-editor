name: Launcher
on:
  workflow_dispatch:
  push:
    paths: ['**.go', 'go.mod', 'tools/build_launcher.py', 'docs/LAUNCHER.md', 'packaging/docker/seccomp.json', '.github/workflows/launcher.yml']
  pull_request:
    paths: ['**.go', 'go.mod', 'tools/build_launcher.py', 'docs/LAUNCHER.md', 'packaging/docker/seccomp.json', '.github/workflows/launcher.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - name: Test launcher behavior
        run: |
          go test ./...
          go vet ./...
      - name: Cross-build launcher archives
        run: python3 tools/build_launcher.py
      - uses: actions/upload-artifact@v4
        with:
          name: pdf-editor-launchers
          path: dist/launcher/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: pdf-editor-launcher-checksums
          path: dist/launcher/SHA256SUMS
