name: Docker Preview
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the validated image to Docker Hub
        type: boolean
        default: false
      tag:
        description: Version tag for ewave/pdf-form-editor
        type: string
        default: '0.1.0'
permissions:
  contents: read
jobs:
  image:
    runs-on: [self-hosted, linux, x64, pdf-editor-sandbox]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate configuration and tag
        env:
          IMAGE_TAG: ${{ inputs.tag }}
        run: |
          python3 -c 'import os,re; assert re.fullmatch(r"[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}",os.environ["IMAGE_TAG"])'
          docker compose config --quiet
          bash -n packaging/docker/start.sh packaging/docker/healthcheck.sh packaging/docker/verify.sh
          python3 tools/generate_docker_seccomp.py
          git diff --exit-code -- packaging/docker/seccomp.json
      - name: Build verification image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: verification
          load: true
          platforms: linux/amd64
          tags: ewave/pdf-form-editor:verification
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Validate native runtime and worker isolation
        run: |
          docker run --rm --user 1000:1000 --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --security-opt seccomp=packaging/docker/seccomp.json --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m,mode=1777 \
            --tmpfs /home/pdfeditor:rw,nosuid,nodev,size=64m,mode=1777 \
            ewave/pdf-form-editor:verification
      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: ewave/pdf-form-editor:${{ inputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Install browser validation tools
        run: |
          npm ci --prefix tests/browser --ignore-scripts
          npm ci --prefix tests/reader --ignore-scripts
          tests/browser/node_modules/.bin/playwright install chromium
          python3 tools/generate_probe_fixtures.py
      - name: Browser walkthrough
        env:
          PDF_EDITOR_IMAGE: ewave/pdf-form-editor:${{ inputs.tag }}
          PDF_EDITOR_DOCUMENTS: /tmp/pdf-editor-ci-documents
          PDF_EDITOR_PORT: '18080'
        run: |
          export PDF_EDITOR_UID="$(id -u)" PDF_EDITOR_GID="$(id -g)"
          mkdir -p "$PDF_EDITOR_DOCUMENTS"
          docker compose up -d --wait --wait-timeout 60
          node tests/browser/check.mjs http://127.0.0.1:18080 "$PDF_EDITOR_DOCUMENTS"
      - name: Stop browser session
        if: always()
        env:
          PDF_EDITOR_DOCUMENTS: /tmp/pdf-editor-ci-documents
          PDF_EDITOR_PORT: '18080'
        run: docker compose down
      - name: Export corresponding source
        uses: docker/build-push-action@v6
        with:
          context: .
          target: source-export
          outputs: type=local,dest=dist/docker-source
          cache-from: type=gha
      - uses: actions/upload-artifact@v4
        with:
          name: docker-corresponding-source-${{ inputs.tag }}
          path: dist/docker-source
      - name: Login to Docker Hub
        if: inputs.publish
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push validated image
        if: inputs.publish
        env:
          IMAGE_TAG: ${{ inputs.tag }}
        run: docker push "ewave/pdf-form-editor:$IMAGE_TAG"
