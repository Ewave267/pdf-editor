name: Native Linux candidates

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    # RHEL 9-compatible host is deliberate: building on newer Ubuntu/Fedora
    # silently raises the glibc requirement and breaks the intended target.
    runs-on: [self-hosted, linux, x64, pdf-editor-rhel9]
    steps:
      - uses: actions/checkout@v4
      - name: Check build-host baseline and tools
        run: |
          python3 - <<'PY'
          import platform, shutil, sys
          assert platform.libc_ver() == ('glibc', '2.34'), platform.libc_ver()
          assert sys.version_info >= (3, 12), 'Validation tooling requires Python 3.12+'
          for tool in ('cmake', 'git', 'ninja', 'bwrap', 'readelf', 'ldd', 'rpm', 'mksquashfs', 'node'):
              assert shutil.which(tool), 'Missing build prerequisite: ' + tool
          PY
      - uses: actions/cache@v4
        id: pdfium
        with:
          path: .deps/pdfium-patched
          key: pdfium-rhel9-x64-${{ hashFiles('tools/build_pdfium.py', 'third_party/pdfium/patches/*.patch', 'LICENSE') }}
      - name: Build patched PDFium on the compatibility baseline
        if: steps.pdfium.outputs.cache-hit != 'true'
        run: python3 tools/build_pdfium.py --jobs 4
      - name: Install independent-reader dependencies
        run: npm ci --prefix tests/reader --ignore-scripts
      - name: Build real native viewer and checks
        run: |
          python3 tools/generate_probe_fixtures.py
          cmake -S . -B build-native -DCMAKE_BUILD_TYPE=Release \
            -DPDF_EDITOR_BUILD_VIEWER=ON -DPDF_EDITOR_BUILD_XFA_PROBE=ON \
            -DPDFium_DIR="$PWD/.deps/pdfium-patched"
          cmake --build build-native --parallel 4
          ctest --test-dir build-native --output-on-failure
      - name: Download and verify pinned AppImage runtime
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, urllib.request
          pin = json.loads(pathlib.Path('packaging/native/appimage-runtime.json').read_text())
          data = urllib.request.urlopen(pin['url']).read()
          assert hashlib.sha256(data).hexdigest() == pin['sha256'], 'AppImage runtime hash changed'
          pathlib.Path('/tmp/pdf-editor-runtime').write_bytes(data)
          # The runtime release includes GPL/MIT notices; a distributor must
          # provide the corresponding source matching the pinned binary too.
          license_data = urllib.request.urlopen(pin['license_url']).read()
          assert hashlib.sha256(license_data).hexdigest() == pin['license_sha256'], 'AppImage license hash changed'
          pathlib.Path('/tmp/pdf-editor-runtime-LICENSE').write_bytes(license_data)
          PY
      - name: Bundle Qt, PDFium, fonts and sandbox
        run: |
          python3 tools/package_native.py --build-dir build-native \
            --qt-runtime /usr/lib64/qt6 --font-dir /usr/share/fonts/liberation-sans-fonts \
            --appimage-runtime /tmp/pdf-editor-runtime \
            --appimage-license /tmp/pdf-editor-runtime-LICENSE
      - name: Validate both relocated formats and RHEL 9 glibc baseline
        run: |
          python3 tools/check_native.py dist/native/*.tar.gz --harness build-native/viewer-tests --max-glibc 2.34
          python3 tools/check_native.py dist/native/*.AppImage --harness build-native/viewer-tests --max-glibc 2.34
          cd dist/native
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: native-linux-rhel9-candidates
          path: dist/native/
