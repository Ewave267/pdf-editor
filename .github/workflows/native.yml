name: Native release candidates

on:
  workflow_dispatch:
    inputs:
      linux_arch:
        description: Linux architectures to build
        type: choice
        options: [all, x86_64, aarch64]
        default: all
      build_desktop:
        description: Also build Windows and macOS
        type: boolean
        default: true
  push:
    branches: [native-releases, main, master]
    paths:
      - 'src/**'
      - 'qml/**'
      - 'CMakeLists.txt'
      - 'VERSION'
      - 'tools/**'
      - 'packaging/native/**'
      - 'third_party/pdfium/**'
      - '.github/workflows/native.yml'

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}-${{ inputs.linux_arch || (contains(github.event.head_commit.message, '[linux-aarch64]') && 'aarch64' || 'all') }}
  cancel-in-progress: true

jobs:
  pdfium-arm64:
    name: Cross-build ARM64 PDFium for native validation
    if: inputs.linux_arch != 'x86_64'
    runs-on: ubuntu-22.04
    container: rockylinux:9
    timeout-minutes: 360
    steps:
      - name: Install checkout prerequisites
        run: dnf -y install git tar gzip ca-certificates
      - uses: actions/checkout@v6
      - name: Install baseline build tools
        run: bash tools/setup_native_linux.sh
      - uses: actions/cache/restore@v5
        id: pdfium
        with:
          path: .deps/pdfium-patched
          key: pdfium-native-rhel9-arm64-${{ hashFiles('tools/build_pdfium.py', 'third_party/pdfium/patches/*.patch', 'tools/setup_native_linux.sh', 'tools/build_pdfium_linux_arm64.sh', 'LICENSE') }}
      - name: Cross-build using the pinned Chromium compiler and ARM baseline headers
        if: steps.pdfium.outputs.cache-hit != 'true'
        run: bash tools/build_pdfium_linux_arm64.sh
      - uses: actions/upload-artifact@v7
        with:
          name: pdfium-linux-arm64-build-inputs
          path: .deps/pdfium-patched/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: pdfium-linux-arm64-diagnostics
          path: .deps/logs/

  linux-build:
    name: Linux ${{ matrix.arch }} build (RHEL 9 baseline)
    needs: pdfium-arm64
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((inputs.linux_arch == 'aarch64' || contains(github.event.head_commit.message, '[linux-aarch64]')) && '[{"arch":"aarch64","cpu":"arm64","runner":"ubuntu-22.04-arm"}]' || inputs.linux_arch == 'x86_64' && '[{"arch":"x86_64","cpu":"x64","runner":"ubuntu-22.04"}]' || '[{"arch":"x86_64","cpu":"x64","runner":"ubuntu-22.04"},{"arch":"aarch64","cpu":"arm64","runner":"ubuntu-22.04-arm"}]') }}
    runs-on: ${{ matrix.runner }}
    container: rockylinux:9
    timeout-minutes: 180
    steps:
      - name: Install checkout prerequisites
        run: dnf -y install git tar gzip ca-certificates
      - uses: actions/checkout@v6
      - name: Install baseline SDK and packaging dependencies
        run: bash tools/setup_native_linux.sh
      - uses: actions/cache/restore@v5
        id: pdfium
        with:
          path: .deps/pdfium-patched
          key: pdfium-native-rhel9-${{ matrix.cpu }}-${{ hashFiles('tools/build_pdfium.py', 'third_party/pdfium/patches/*.patch', 'tools/setup_native_linux.sh', 'tools/build_pdfium_linux_arm64.sh', 'LICENSE') }}
      - uses: actions/download-artifact@v7
        if: matrix.cpu == 'arm64' && steps.pdfium.outputs.cache-hit != 'true'
        with:
          name: pdfium-linux-arm64-build-inputs
          path: .deps/pdfium-patched
      - name: Run PDFium XML tests on native ARM hardware
        if: matrix.cpu == 'arm64'
        run: |
          chmod +x .deps/pdfium-patched/build-tests/pdfium_unittests
          .deps/pdfium-patched/build-tests/pdfium_unittests --gtest_filter='CFXXML*'
      - name: Cache native-tested ARM PDFium
        if: matrix.cpu == 'arm64' && steps.pdfium.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .deps/pdfium-patched
          key: ${{ steps.pdfium.outputs.cache-primary-key }}
      - name: Build native binaries and portable bundles against glibc 2.34
        shell: bash
        run: |
          useradd --create-home native-builder
          chown -R native-builder:native-builder "$GITHUB_WORKSPACE"
          runuser -u native-builder -- env HOME=/home/native-builder bash tools/build_native_linux.sh
          mkdir -p ci-linux
          cp build-native/native-smoke ci-linux/
      - name: Cache tested x86_64 PDFium
        if: matrix.cpu == 'x64' && steps.pdfium.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .deps/pdfium-patched
          key: ${{ steps.pdfium.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v7
        with:
          name: linux-validation-inputs-${{ matrix.arch }}
          compression-level: 0
          retention-days: 1
          path: |
            dist/native/*.tar.gz
            dist/native/*.AppImage
            dist/native/SHA256SUMS
            ci-linux/native-smoke
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: linux-build-diagnostics-${{ matrix.arch }}
          path: .deps/logs/

  linux:
    name: Linux ${{ matrix.arch }} validate and package
    needs: linux-build
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((inputs.linux_arch == 'aarch64' || contains(github.event.head_commit.message, '[linux-aarch64]')) && '[{"arch":"aarch64","runner":"ubuntu-22.04-arm"}]' || inputs.linux_arch == 'x86_64' && '[{"arch":"x86_64","runner":"ubuntu-22.04"}]' || '[{"arch":"x86_64","runner":"ubuntu-22.04"},{"arch":"aarch64","runner":"ubuntu-22.04-arm"}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/download-artifact@v7
        with:
          name: linux-validation-inputs-${{ matrix.arch }}
          path: .
      - name: Restore executable permissions
        run: chmod +x ci-linux/native-smoke dist/native/*.AppImage
      - name: Check relocated tarball and AppImage
        run: |
          python3 tools/check_native.py dist/native/*.tar.gz --smoke ci-linux/native-smoke \
            --max-glibc 2.34 --results dist/native/validation-tar
          python3 tools/check_native.py dist/native/*.AppImage --smoke ci-linux/native-smoke \
            --max-glibc 2.34 --results dist/native/validation-appimage
          dist/native/*.AppImage --appimage-extract-and-run --version
          cd dist/native
          sha256sum --check SHA256SUMS
      - name: Independently verify saved form values
        run: |
          npm ci --prefix tests/reader --ignore-scripts
          for folder in dist/native/validation-tar dist/native/validation-appimage; do
            for generation in 1 2; do
              node tools/check_form_controls.mjs tests/reader/node_modules/pdfjs-dist "$folder/normal-$generation.pdf" normal
              node tools/check_form_controls.mjs tests/reader/node_modules/pdfjs-dist "$folder/acroform-$generation.pdf" acroform
              node tools/check_form_controls.mjs tests/reader/node_modules/pdfjs-dist "$folder/xfa-$generation.pdf" xfa
            done
          done
      - uses: actions/upload-artifact@v7
        with:
          name: pdf-editor-linux-${{ matrix.arch }}
          path: |
            dist/native/*.tar.gz
            dist/native/*.AppImage
            dist/native/SHA256SUMS
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: linux-validation-diagnostics-${{ matrix.arch }}
          path: dist/native/validation-*/

  desktop:
    name: ${{ matrix.target }} ${{ matrix.cpu }}
    if: (github.event_name != 'workflow_dispatch' || inputs.build_desktop) && !contains(github.event.head_commit.message, '[linux-aarch64]')
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows
            cpu: x64
            runner: windows-2025
            qt-arch: win64_msvc2022_64
            build-jobs: 2
          - target: macos
            cpu: arm64
            runner: macos-15
            qt-arch: clang_64
            build-jobs: 2
          - target: macos
            cpu: x64
            runner: macos-15-intel
            qt-arch: clang_64
            build-jobs: 4
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep patches in LF format
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Configure the native MSVC x64 developer environment
        if: matrix.target == 'windows'
        shell: pwsh
        run: ./tools/setup_msvc.ps1
      - name: Install the Windows SDK required by pinned PDFium
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $sdkBin = 'C:\Program Files (x86)\Windows Kits\10\bin\10.0.28000.0\x64'
          if (!(Test-Path "$sdkBin\rc.exe")) {
            $installer = Join-Path $env:RUNNER_TEMP 'pdf-editor-winsdk.exe'
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/?linkid=2370315' -OutFile $installer
            $process = Start-Process $installer -ArgumentList '/features','OptionId.DesktopCPPx64','/quiet','/norestart' -Wait -PassThru
            if ($process.ExitCode -notin @(0, 3010)) { throw "Windows SDK installation failed: $($process.ExitCode)" }
          }
          if (!(Test-Path "$sdkBin\rc.exe")) { throw 'Required SDK 10.0.28000.0 is missing' }
          $sdkBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          'PDF_EDITOR_BASH=C:/Program Files/Git/bin/bash.exe' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          setup-python: false
          arch: ${{ matrix.qt-arch }}
          cache: true
      - name: Select Python for the pinned PDFium build tools
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@v5
        id: pdfium
        with:
          path: .deps/pdfium-patched
          key: pdfium-native-${{ matrix.target }}-${{ matrix.cpu }}-${{ hashFiles('tools/build_pdfium.py', 'third_party/pdfium/patches/*.patch', 'LICENSE') }}
      - name: Build and XML-test pinned patched PDFium
        if: steps.pdfium.outputs.cache-hit != 'true'
        run: python tools/build_pdfium.py --jobs ${{ matrix.build-jobs }}
      - name: Cache XML-tested PDFium before application deployment
        if: steps.pdfium.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .deps/pdfium-patched
          key: ${{ steps.pdfium.outputs.cache-primary-key }}
      - name: Configure and build real native viewer
        env:
          MACOSX_DEPLOYMENT_TARGET: '13.0'
        run: |
          cmake -S . -B build-native -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DPDF_EDITOR_BUILD_VIEWER=ON -DBUILD_TESTING=OFF \
            -DPDF_EDITOR_BUILD_NATIVE_SMOKE=ON -DPDFium_DIR="$PWD/.deps/pdfium-patched"
          cmake --build build-native --parallel ${{ matrix.build-jobs }}
      - name: Fetch matching Qt source and license inputs
        run: python tools/fetch_native_inputs.py --qt-version 6.8.3
      - name: Deploy and test packaged application
        run: |
          python tests/test_windows_runtime.py
          helper=build-native/native-smoke
          if [[ '${{ matrix.target }}' == windows ]]; then helper+=.exe; fi
          python tools/package_desktop.py --target '${{ matrix.target }}' \
            --build-dir build-native --qt-prefix "$QT_ROOT_DIR" \
            --qt-notices .deps/release-inputs/qt-notices --smoke "$helper"
      - name: Independently verify both saved generations
        run: |
          npm ci --prefix tests/reader --ignore-scripts
          for directory in dist/native/validation dist/native/validation/logon-station dist/native/validation/early-open; do
            if [[ ! -d "$directory" ]]; then continue; fi
            for generation in 1 2; do
              node tools/check_form_controls.mjs tests/reader/node_modules/pdfjs-dist "$directory/normal-$generation.pdf" normal
              node tools/check_form_controls.mjs tests/reader/node_modules/pdfjs-dist "$directory/acroform-$generation.pdf" acroform
              node tools/check_form_controls.mjs tests/reader/node_modules/pdfjs-dist "$directory/xfa-$generation.pdf" xfa
            done
          done
      - uses: actions/upload-artifact@v7
        if: matrix.target == 'windows'
        with:
          name: pdf-editor-${{ matrix.target }}-${{ matrix.cpu }}
          path: dist/native/windows/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: matrix.target != 'windows'
        with:
          name: pdf-editor-${{ matrix.target }}-${{ matrix.cpu }}
          path: |
            dist/native/*.zip
            dist/native/SHA256SUMS
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: qt-sources-${{ matrix.target }}-${{ matrix.cpu }}
          path: .deps/release-inputs/qt-sources/
          compression-level: 0
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: diagnostics-${{ matrix.target }}-${{ matrix.cpu }}
          path: |
            .deps/logs/
            dist/native/validation/
