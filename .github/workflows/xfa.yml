name: PDF Integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xfa:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install build, Qt, and sandbox tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap ninja-build meson libcap-dev libselinux1-dev \
            fonts-liberation qt6-base-dev qt6-declarative-dev \
            qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-dialogs \
            qml6-module-qtquick-layouts qml6-module-qtquick-templates \
            qml6-module-qtquick-window qml6-module-qtqml-workerscript qml6-module-qt-labs-folderlistmodel
      - name: Build the sandbox version required by the worker
        run: |
          python3 tools/build_bubblewrap.py
          # Keep the distro's existing executable path and user-namespace profile.
          sudo install -m 0755 .deps/bubblewrap-build/bwrap /usr/bin/bwrap
      - uses: actions/cache@v5
        id: pdfium
        with:
          path: .deps/pdfium-patched
          key: pdfium-linux-x64-${{ hashFiles('tools/build_pdfium.py', 'third_party/pdfium/patches/*.patch', 'LICENSE') }}
      - name: Build and unit-test patched PDFium
        if: steps.pdfium.outputs.cache-hit != 'true'
        run: python3 tools/build_pdfium.py --jobs 4
      - name: Install pinned independent reader
        run: npm ci --prefix tests/reader --ignore-scripts
      - name: Configure
        run: >-
          cmake -S . -B build-xfa -DCMAKE_BUILD_TYPE=Release
          -DPDF_EDITOR_BUILD_XFA_PROBE=ON -DPDF_EDITOR_BUILD_VIEWER=ON -DPDFium_DIR="$PWD/.deps/pdfium-patched"
      - name: Build
        run: cmake --build build-xfa --parallel
      - name: Validate regressions, isolation, and independent-reader round trips
        run: ctest --test-dir build-xfa --output-on-failure
      - name: Build Linux preview archive
        run: |
          cpack --config build-xfa/CPackConfig.cmake -B dist
          sha256sum dist/*.tar.gz > dist/SHA256SUMS
      - name: Verify relocated package
        run: |
          mkdir -p /tmp/pdf-editor-preview
          tar -xzf dist/*.tar.gz -C /tmp/pdf-editor-preview
          python3 tools/check_package.py /tmp/pdf-editor-preview/pdf-form-editor-* build-xfa/viewer-tests
      - uses: actions/upload-artifact@v6
        with:
          name: linux-ubuntu-24.04-preview
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
