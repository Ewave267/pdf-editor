name: Dependency security
on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/build_pdfium.py'
      - 'tools/check_dependency_security.py'
      - 'tests/reader/package*.json'
      - '.github/workflows/dependency-security.yml'
permissions:
  contents: read
jobs:
  advisories:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Check tracked dependencies without rebuilding
        run: python tools/check_dependency_security.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: dependency-security-report
          path: dist/dependency-security.json
